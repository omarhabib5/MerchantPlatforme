<div class="login-shell">
  <div class="login-panel">
    <span class="badge">MERCHANT PLATFORM</span>
    <h1>Sign in to your<br />merchant dashboard</h1>
    <p class="lead">
      Enter your email and password to access your orders, products, and messages.
    </p>

    <form (ngSubmit)="submit()" class="login-form">
      <label>
        Email
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" autocomplete="email" />
      </label>

      <label>
        Password
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Your password"
          autocomplete="current-password"
        />
      </label>

      <p class="error-banner" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="signup-hint">
      New here? <a routerLink="/signup">Create a merchant account</a>
    </p>
  </div>
</div>
